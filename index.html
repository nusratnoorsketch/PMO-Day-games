<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PMO Picture Pictionary | Centennial College</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ff3cac; --purple:#a855f7; --orange:#ff8a00; --lime:#c6e03a;
    --gold:#ffd23f; --bg1:#1a0b2e; --bg2:#2d0b3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,sans-serif;color:#fff;min-height:100vh;
    background:radial-gradient(circle at 20% 20%,#3b0f4f 0%,transparent 45%),
               radial-gradient(circle at 80% 80%,#4a1a0b 0%,transparent 45%),
               linear-gradient(135deg,var(--bg1),var(--bg2));
    overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;
  }
  /* floating glow orbs */
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:float 14s ease-in-out infinite}
  .o1{width:320px;height:320px;background:var(--pink);top:-80px;left:-80px}
  .o2{width:280px;height:280px;background:var(--orange);bottom:-60px;right:-60px;animation-delay:-4s}
  .o3{width:220px;height:220px;background:var(--purple);top:40%;left:70%;animation-delay:-8s}
  .o4{width:200px;height:200px;background:var(--lime);top:60%;left:5%;animation-delay:-2s;opacity:.3}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}

  header{text-align:center;margin-bottom:18px}
  .logo{height:80px;border-radius:10px;box-shadow:0 0 25px rgba(198,224,58,.45);margin-bottom:12px;}
  h1{
    font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,var(--pink),var(--gold),var(--lime),var(--orange),var(--pink));
    background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 6s linear infinite;filter:drop-shadow(0 0 12px rgba(255,60,172,.6));
  }
  @keyframes shine{to{background-position:300% center}}
  .sub{opacity:.85;margin-top:4px}

  /* scoreboard */
  .stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0}
  .pill{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
        backdrop-filter:blur(8px);font-weight:600;box-shadow:0 0 14px rgba(168,85,247,.35)}
  .pill b{color:var(--gold)}

  /* main card */
  .card{
    width:min(720px,100%);padding:22px;border-radius:26px;position:relative;
    background:rgba(26,11,46,.92);border:1px solid rgba(255,255,255,.18);
  }
  .card::before{ /* animated rainbow glow border */
    content:"";position:absolute;inset:-3px;border-radius:28px;z-index:-1;
    background:conic-gradient(from var(--a,0deg),var(--pink),var(--orange),var(--gold),var(--lime),var(--purple),var(--pink));
    filter:blur(10px);animation:spin 5s linear infinite;
  }
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes spin{to{--a:360deg}}

  .frame{
    background:#fff;border-radius:18px;height:340px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 0 30px rgba(255,210,63,.45),inset 0 0 0 4px rgba(255,60,172,.25);
  }
  .frame img{max-width:100%;max-height:100%;object-fit:contain;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
  .frame img.blur{filter:blur(14px) saturate(1.4)}
  @keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:scale(1);opacity:1}}

  .q{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-weight:600}
  .dots{display:flex;gap:6px;flex-wrap:wrap}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.25)}
  .dot.now{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .dot.ok{background:var(--lime);box-shadow:0 0 8px var(--lime)}
  .dot.miss{background:var(--pink);box-shadow:0 0 8px var(--pink)}

  .hint{min-height:28px;text-align:center;letter-spacing:6px;font-size:1.25rem;font-weight:800;color:var(--gold);
        text-shadow:0 0 10px rgba(255,210,63,.8);margin:6px 0}
  .answer{min-height:44px;text-align:center;font-size:1.9rem;font-weight:800;color:var(--lime);
          text-shadow:0 0 14px var(--lime),0 0 30px rgba(198,224,58,.6)}
  .answer.show{animation:pop .5s}
  .def{text-align:center;opacity:.9;min-height:24px;font-size:.95rem}

  .guess{display:flex;gap:10px;margin:14px 0}
  .guess input{
    flex:1;padding:14px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);
    color:#fff;font:600 1rem 'Poppins',sans-serif;outline:none;transition:.2s
  }
  .guess input:focus{border-color:var(--pink);box-shadow:0 0 16px rgba(255,60,172,.6)}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{
    border:none;cursor:pointer;padding:12px 20px;border-radius:14px;font:700 .95rem 'Poppins',sans-serif;color:#fff;
    transition:transform .15s,box-shadow .2s;
  }
  button:hover{transform:translateY(-3px) scale(1.04)}
  .b-check{background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 0 18px rgba(255,60,172,.6)}
  .b-hint{background:linear-gradient(135deg,var(--gold),var(--orange));color:#2d0b3a;box-shadow:0 0 18px rgba(255,170,0,.6)}
  .b-reveal{background:linear-gradient(135deg,var(--purple),#6d28d9);box-shadow:0 0 18px rgba(168,85,247,.6)}
  .b-next{background:linear-gradient(135deg,var(--lime),#7cb518);color:#1a0b2e;box-shadow:0 0 18px rgba(198,224,58,.7)}
  .b-mode{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}

  .timer{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:14px}
  .timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--lime),var(--gold),var(--pink));transition:width 1s linear}

  /* end screen */
  .end{display:none;text-align:center;padding:30px 10px}
  .end h2{font-size:2.2rem;color:var(--gold);text-shadow:0 0 18px var(--gold)}
  .end p{font-size:1.2rem;margin:12px 0 20px}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  footer{margin-top:22px;opacity:.6;font-size:.8rem}
  @media(max-width:520px){.frame{height:240px}.answer{font-size:1.4rem}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
<canvas id="confetti"></canvas>

<header>
  <img class="logo" src="images/logo.png" alt="Centennial College logo" />
  <h1>PMO Picture Pictionary</h1>
  <p class="sub">Look at the picture ✨ Guess the Project Management term!</p>
</header>

<div class="stats">
  <span class="pill">⭐ Score: <b id="score">0</b></span>
  <span class="pill">🔥 Streak: <b id="streak">0</b></span>
  <span class="pill">⏱️ <b id="time">30</b>s</span>
</div>

<div class="card">
  <div id="game">
    <div class="frame"><img id="pic" alt="Guess the PMO term" /></div>
    <div class="q"><span id="count">Picture 1 / 12</span><div class="dots" id="dots"></div></div>
    <div class="hint" id="hint"></div>
    <div class="answer" id="answer"></div>
    <div class="def" id="def"></div>
    <div class="guess">
      <input id="guess" placeholder="Type your guess and press Enter…" autocomplete="off" />
    </div>
    <div class="btns">
      <button class="b-check" onclick="check()">✅ Check</button>
      <button class="b-hint" onclick="hint()">💡 Hint</button>
      <button class="b-reveal" onclick="reveal()">👀 Reveal</button>
      <button class="b-next" onclick="next()">➡️ Next</button>
      <button class="b-mode" id="mode" onclick="toggleBlur()">🌫️ Blur mode: Off</button>
    </div>
    <div class="timer"><i id="bar"></i></div>
  </div>
  <div class="end" id="end">
    <h2>🎉 Game Over! 🎉</h2>
    <p>You scored <b id="final"></b> — PMO superstar!</p>
    <button class="b-next" onclick="start()">🔁 Play Again</button>
  </div>
</div>
<footer>Centennial College · PMO / Shared Services</footer>

<script>
/* ===== EDIT HERE: one line per picture ===== */
const CARDS = [
  {img:"images/action-item.webp",        answer:"Action Item",         alt:["action items","action"],          def:"A task assigned to someone with a due date."},
  {img:"images/behind-schedule.webp",    answer:"Behind Schedule",     alt:["late","delayed","delay"],         def:"The project is running later than planned."},
  {img:"images/budget.webp",             answer:"Budget",              alt:["project budget","cost","funding"],def:"The money approved to deliver the project."},
  {img:"images/deadline.webp",           answer:"Deadline",            alt:["due date"],                       def:"The date by which work must be completed."},
  {img:"images/dependencies.jpg",       answer:"Dependencies",        alt:["dependency","domino effect"],     def:"Tasks that rely on other tasks being done first."},
  {img:"images/milestone.webp",          answer:"Milestone",           alt:["milestones"],                     def:"A key checkpoint or achievement in the project."},
  {img:"images/project-dashboard.webp",  answer:"Project Dashboard",   alt:["dashboard","power bi","report"],  def:"A visual summary of project status and KPIs."},
  {img:"images/project-integration.webp",answer:"Project Integration", alt:["integration","teamwork","collaboration"], def:"Bringing all project pieces together as one."},
  {img:"images/project-roadmap.jpg",    answer:"Project Roadmap",     alt:["roadmap"],                        def:"A high-level plan showing the journey and goals."},
  {img:"images/rag.webp",                answer:"RAG Status",          alt:["rag","red amber green","traffic light"], def:"Red / Amber / Green project health rating."},
  {img:"images/risk-mitigation.webp",    answer:"Risk Mitigation",     alt:["risk","risks","risk management"], def:"Actions taken to reduce the impact of risks."},
  {img:"images/stakeholders.webp",       answer:"Stakeholders",        alt:["stakeholder","stakeholder meeting"], def:"People who are affected by or invested in the project."}
];
const SECONDS = 30;
/* =========================================== */

let deck=[],i=0,score=0,streak=0,hints=0,done=false,blur=false,t=SECONDS,tick,results=[];
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();

function start(){
  deck=[...CARDS].sort(()=>Math.random()-.5);
  i=0;score=0;streak=0;results=[];
  $("end").style.display="none";$("game").style.display="block";
  load();
}
function load(){
  const c=deck[i];done=false;hints=0;
  const pic=$("pic");pic.classList.remove("blur");void pic.offsetWidth;
  pic.src=c.img;if(blur)pic.classList.add("blur");
  $("answer").textContent="";$("def").textContent="";$("guess").value="";
  $("hint").textContent=c.answer.replace(/[A-Za-z]/g,"_");
  $("count").textContent=`Picture ${i+1} / ${deck.length}`;
  $("dots").innerHTML=deck.map((_,k)=>`<span class="dot ${k===i?"now":results[k]||""}"></span>`).join("");
  $("score").textContent=score;$("streak").textContent=streak;
  $("guess").focus();startTimer();
}
function startTimer(){
  clearInterval(tick);t=SECONDS;$("time").textContent=t;$("bar").style.width="100%";
  tick=setInterval(()=>{t--;$("time").textContent=t;$("bar").style.width=(t/SECONDS*100)+"%";
    if(t<=0){clearInterval(tick);reveal();}},1000);
}
function check(){
  if(done)return;const g=norm($("guess").value),c=deck[i];
  if(!g)return;
  if([c.answer,...c.alt].map(norm).includes(g)){
    done=true;clearInterval(tick);streak++;
    const pts=Math.max(10-hints*3,4)+Math.floor(t/5)+(streak>=3?5:0);
    score+=pts;results[i]="ok";show(`🎉 ${c.answer} (+${pts})`);confetti();
  }else{
    const inp=$("guess");inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");
  }
}
function hint(){
  if(done)return;const a=deck[i].answer;hints++;
  let shown=0;
  $("hint").textContent=a.split("").map(ch=>/[A-Za-z]/.test(ch)?(shown++<hints*2?ch:"_"):ch).join("");
  if(blur&&hints===1)$("pic").classList.remove("blur");
}
function reveal(){
  if(done)return;done=true;clearInterval(tick);streak=0;results[i]="miss";
  show(deck[i].answer);
}
function show(txt){
  $("pic").classList.remove("blur");
  const a=$("answer");a.textContent=txt;a.classList.remove("show");void a.offsetWidth;a.classList.add("show");
  $("def").textContent=deck[i].def;$("hint").textContent="";
  $("score").textContent=score;$("streak").textContent=streak;
  $("dots").children[i].className="dot "+results[i];
}
function next(){
  if(!done){results[i]="miss";streak=0;}
  i++;
  if(i>=deck.length){clearInterval(tick);$("game").style.display="none";$("end").style.display="block";
    $("final").textContent=score+" points";confetti(250);return;}
  load();
}
function toggleBlur(){blur=!blur;$("mode").textContent="🌫️ Blur mode: "+(blur?"On":"Off");
  if(!done)$("pic").classList.toggle("blur",blur);}
$("guess").addEventListener("keydown",e=>{if(e.key==="Enter")done?next():check();});

/* glowing confetti */
function confetti(n=120){
  const cv=$("confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ff3cac","#ffd23f","#c6e03a","#ff8a00","#a855f7"];
  const p=Array.from({length:n},()=>({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,
    s:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;(function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.45;q.r+=.2;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);
      ctx.shadowBlur=12;ctx.shadowColor=q.c;ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);ctx.restore();});
    if(++f<120)requestAnimationFrame(draw);else ctx.clearRect(0,0,cv.width,cv.height);})();
}
start();
</script>
</body>
</html>
